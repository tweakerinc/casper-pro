name: Pro native memory and reader regressions
on:
  push:
    branches: [fix/pro-reader-memory-touch-20261002]
    paths: ['src/**', 'lib/**', 'test/**', 'freeink-sdk/**']
  pull_request:
    branches: [main, cursor/x4pro-sleep-reader-menu-6b98]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pro-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test actual core with simulated hardware and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          bash test/pro_repairs/run.sh /tmp/pro-host-tests 2>&1 | tee native-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-regressions-${{ github.sha }}
          path: native-tests.log
          retention-days: 7
