name: Apply and validate Pro repairs

on:
  push:
    branches: [fix/pro-reader-memory-touch-20261002]
    paths: [.github/workflows/pro-apply-repair.yml]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pro-reader-memory-touch-20261002
          fetch-depth: 0
      - name: Verify and apply exact reviewed patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pro-reader-memory-touch-20261002
          git merge-base --is-ancestor 53797361f451242b8cd4e2cea19ac449c83c1ef5 HEAD
          cat .github/repair-transfer/part{1,2,3}.b64 | base64 --decode | xz --decompress > /tmp/pro-repairs.patch
          echo '4ccd9d437f35e12e2e872e317ec86741121693f89c0aef6799f48dd0b9f5ea32  /tmp/pro-repairs.patch' | sha256sum --check
          git apply --check --unidiff-zero /tmp/pro-repairs.patch
          git apply --index --unidiff-zero /tmp/pro-repairs.patch
          git rm .github/repair-transfer/part{1,2,3}.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pro): harden reader memory, fonts, gestures and add Book Appearance drawer'
          git push origin HEAD:refs/heads/fix/pro-reader-memory-touch-20261002
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Native memory and reader regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash test/pro_repairs/run.sh /tmp/pro-host-tests 2>&1 | tee native-tests.log
      - name: Archive exact source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          git archive --format=tar.gz HEAD > validation/casper-pro-source.tar.gz
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          sha256sum validation/casper-pro-source.tar.gz > validation/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-native-source-${{ needs.apply.outputs.sha }}
          path: |
            native-tests.log
            validation/
          retention-days: 7
          if-no-files-found: error

  build:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [x4pro, default]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pro-pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pro-pio-${{ runner.os }}-${{ matrix.target }}-
      - name: Install build tools
        run: python -m pip install platformio==6.1.18 pyyaml jinja2
      - name: Prepare optional local configuration
        run: touch platformio.local.ini
      - name: Build exact target
        shell: bash
        run: |
          set -euo pipefail
          pio run -e '${{ matrix.target }}' 2>&1 | tee build-${{ matrix.target }}.log
      - name: Record candidate identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp .pio/build/${{ matrix.target }}/firmware.bin candidate/
          cp .pio/build/${{ matrix.target }}/firmware.elf candidate/
          git rev-parse HEAD > candidate/SOURCE_COMMIT.txt
          printf '%s\n' '${{ matrix.target }}' > candidate/TARGET.txt
          sha256sum candidate/firmware.bin > candidate/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-${{ matrix.target }}-${{ needs.apply.outputs.sha }}
          path: |
            build-${{ matrix.target }}.log
            candidate/
          retention-days: 7
          if-no-files-found: warn
