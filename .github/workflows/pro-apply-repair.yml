name: Apply final cursor guards and validate Pro
on:
  push:
    branches: [fix/pro-reader-memory-touch-20261002]
    paths: [.github/workflows/pro-apply-repair.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pro-reader-memory-touch-20261002
          fetch-depth: 0
      - name: Apply verified follow-up and remove one-shot writer
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pro-reader-memory-touch-20261002
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1ac65e3210a3d531e0788cd8c7cbc1d7d14b8cad HEAD
          base64 --decode .github/repair-transfer/cursor-followup.b64 | xz --decompress > /tmp/pro-cursors.patch
          echo '3206aab179d5e2fe8e70cc6494a4da6746e677ffa8b7f4064012ec42cef2c4d5  /tmp/pro-cursors.patch' | sha256sum --check
          git apply --check /tmp/pro-cursors.patch
          git apply --index /tmp/pro-cursors.patch
          git rm .github/repair-transfer/cursor-followup.b64 .github/workflows/pro-apply-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pro): reject corrupt IR cursors and retain read-only validation CI'
          git push origin HEAD:refs/heads/fix/pro-reader-memory-touch-20261002
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Native regressions with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          bash test/pro_repairs/run.sh /tmp/pro-host-tests 2>&1 | tee native-tests.log
      - name: Export exact source identity
        if: always()
        run: |
          mkdir -p validation
          git archive --format=tar.gz HEAD > validation/casper-pro-source.tar.gz
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          sha256sum validation/casper-pro-source.tar.gz > validation/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-native-source-${{ needs.apply.outputs.sha }}
          path: |
            native-tests.log
            validation/
          retention-days: 7
          if-no-files-found: error
  build:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [x4pro, default]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pro-pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pro-pio-${{ runner.os }}-${{ matrix.target }}-
      - name: Install build tools
        run: python -m pip install platformio==6.1.18 pyyaml jinja2
      - name: Build exact target
        shell: bash
        run: |
          set -euo pipefail
          touch platformio.local.ini
          pio run -e '${{ matrix.target }}' 2>&1 | tee build-${{ matrix.target }}.log
      - name: Record candidate identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp .pio/build/${{ matrix.target }}/firmware.bin candidate/
          cp .pio/build/${{ matrix.target }}/firmware.elf candidate/
          git rev-parse HEAD > candidate/SOURCE_COMMIT.txt
          printf '%s\n' '${{ matrix.target }}' > candidate/TARGET.txt
          sha256sum candidate/firmware.bin > candidate/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ matrix.target }}-${{ needs.apply.outputs.sha }}
          path: |
            build-${{ matrix.target }}.log
            candidate/
          retention-days: 7
          if-no-files-found: warn
